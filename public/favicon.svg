<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bbGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#0070f3" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Canvas -->
  <rect width="512" height="512" fill="#000000" />

  <!-- Outer Ambient Cyan Halo -->
  <rect x="72" y="72" width="368" height="368" rx="116" fill="#00d4ff" opacity="0.45" filter="url(#softGlow)" />

  <!-- Main Squircle with Cyan-to-Blue Gradient -->
  <rect x="76" y="76" width="360" height="360" rx="110" fill="url(#bbGlow)" />

  <!-- Black Glitch Pixels -->
  <!-- Far Left Isolated Pixel -->
  <rect x="116" y="248" width="28" height="28" rx="3" fill="#080d16" />

  <!-- Upper Left Pixel -->
